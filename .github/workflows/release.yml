name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token trusted publishing exchanges for a temporary NuGet key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/Digi21.WinUI.Docking/Digi21.WinUI.Docking.csproj -c Release --no-build -o artifacts

      # Trusted publishing: nuget.org exchanges this job's OIDC token for an API key that lasts an
      # hour and is good for one push, so there is no long-lived secret to store or rotate. It has
      # to be the step before the push for that hour to mean anything.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # the nuget.org profile name, not the email address

      # The glob is expanded here rather than handed to dotnet: on Windows, `dotnet nuget push` only
      # expands a wildcard written with backslashes, and a forward-slash one fails with "File does
      # not exist" — indistinguishable from a pack step that produced nothing. Listing the files
      # tells the two apart, and pushing each by full path leaves no wildcard to misread.
      - name: Push to NuGet.org
        run: |
          $packages = @(Get-ChildItem artifacts\*.nupkg)
          if ($packages.Count -eq 0) { throw "no .nupkg in artifacts - the pack step produced nothing" }
          foreach ($package in $packages) {
            Write-Host "pushing $($package.Name)"
            dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed for $($package.Name)" }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
